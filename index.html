<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1a15">
<title>Pads</title>
<style>
  :root { --acc:#1fe08a; --card:#1b2421; --card2:rgba(255,255,255,.11); --line:rgba(255,255,255,.2); --dim:rgba(255,255,255,.45); --red:#ff5a62; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; min-height:100%; touch-action:manipulation; }
  button { touch-action:manipulation; }
  body {
    color:#fff; font-family:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif; overflow-x:hidden;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(31,224,138,.16), transparent 60%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0/28px 28px,
      #0a1a15;
    background-attachment:fixed;
    padding:calc(env(safe-area-inset-top,0px) + 60px) 16px calc(env(safe-area-inset-bottom,0px) + 90px);
  }
  .wrap { max-width:520px; margin:0 auto; }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,monospace; }

  .top { display:flex; justify-content:space-between; align-items:center; margin:0 2px 18px; }
  .top b { font-size:20px; letter-spacing:.02em; }
  .tag { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--acc); border:1px solid rgba(31,224,138,.4);
         background:rgba(31,224,138,.08); padding:6px 10px; border-radius:8px; }
  .tag::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--acc); margin-right:7px; box-shadow:0 0 8px var(--acc); }

  h2 { font-size:11px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin:24px 4px 10px; }

  button { font:inherit; color:#fff; cursor:pointer; border:1px solid var(--line); background:rgba(255,255,255,.10); box-shadow:0 4px 14px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.18); border-radius:18px;
           transition:transform .12s ease, opacity .25s ease, background .25s ease, border-color .25s ease; }
  button:active { transform:scale(.97); }

  .arrivee { width:100%; padding:18px; text-align:left; display:flex; justify-content:space-between; align-items:center;
             border-color:rgba(31,224,138,.6); background:linear-gradient(135deg,rgba(31,224,138,.22),rgba(255,255,255,.10) 70%); }
  .arrivee small, .pad small { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--acc); }
  .arrivee span.t { display:block; font-size:16px; font-weight:600; margin-top:5px; }
  .arrivee .ic { width:38px; height:38px; border-radius:12px; border:1px solid rgba(31,224,138,.5); display:grid; place-items:center; color:var(--acc); font-size:18px; }

  .manche { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .manche.solo { grid-template-columns:1fr; }
  .go, .stop { padding:20px 10px; font-size:15px; font-weight:600; }
  .go, .stop { background:var(--acc); color:#05160e; border:0; box-shadow:0 6px 20px rgba(31,224,138,.28); }
  .stop { background:#a8f5cf; box-shadow:0 6px 20px rgba(168,245,207,.25); }
  .go.active { box-shadow:0 0 0 3px #fff, 0 0 26px rgba(31,224,138,.7); }

  .pads { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pad { min-height:112px; padding:12px; text-align:left; display:flex; flex-direction:column; justify-content:space-between; background:var(--card2); }
  .pad .t2 { display:flex; justify-content:space-between; align-items:flex-start; width:100%; }
  .pad .cpt { font-size:15px; font-weight:700; color:var(--acc); }
  .pad.playing .cpt { color:#05160e; }
  .pad.used .cpt { color:var(--dim); }
  .pad .n { font-size:22px; font-weight:700; color:rgba(255,255,255,.7); }
  .pad .nm { font-size:15px; font-weight:600; line-height:1.2; display:inline-block; margin-bottom:4px; }
  .pad small::before { content:"PRÊT"; }

  .pad.half { background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.45); }
  .pad.half .cpt, .pad.half small { color:rgba(255,255,255,.8); }
  .pad.half small::before { content:"DÉJÀ UTILISÉ"; }
  .pad.playing { background:var(--acc); border-color:var(--acc); color:#05160e; box-shadow:0 0 26px rgba(31,224,138,.6); }
  .pad.playing .n, .pad.playing small { color:#05160e; }
  .pad.playing small::before { content:"EN COURS"; }
  .pad.paused { background:rgba(255,255,255,.05); border-color:var(--acc); }
  .pad.paused small { color:var(--acc); }
  .pad.paused small::before { content:"EN PAUSE"; }
  .used { opacity:.45; filter:grayscale(1); border-color:var(--line) !important; background:rgba(255,255,255,.03) !important; box-shadow:none !important; }
  .pad.used small::before { content:"UTILISÉ"; }
  .pad.used small { color:var(--dim); }
  .go.used, .stop.used { color:rgba(255,255,255,.55); border:1px solid var(--line); }
  .arrivee.used .ic { color:var(--dim); border-color:var(--line); }
  .arrivee.used small { color:var(--dim); }

  .reset { width:100%; margin-top:22px; padding:17px; font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
           background:rgba(255,255,255,.10); color:var(--acc); border:1px solid rgba(31,224,138,.6); }

  .reset.mini { position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); z-index:5; margin:0;
                width:42px; height:42px; padding:0; border-radius:50%;
                font-size:20px; line-height:1; letter-spacing:0; opacity:.75; }
  .modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:24px; z-index:10;
           background:rgba(3,10,8,.7); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .modal.show { display:flex; }
  .box { width:100%; max-width:320px; background:var(--card); border:1px solid rgba(31,224,138,.35); border-radius:22px; padding:24px 18px 18px; text-align:center; }
  .box p { margin:0 0 20px; font-size:19px; font-weight:600; }
  .box .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .box button { padding:15px 8px; font-weight:600; }
  .box .oui { background:var(--acc); color:#05160e; border:0; }
  .tag.off { color:#ffb454; border-color:rgba(255,180,84,.45); background:rgba(255,180,84,.08); }
  .tag.off::before { background:#ffb454; box-shadow:0 0 8px #ffb454; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>Pads</b><span class="tag mono off" id="st">PC non connecté</span></div>

  <div class="pads" id="pads"></div>

  <button class="reset mini" id="reset" aria-label="Réinitialiser">↻</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// Les noms des pads (le son est joué par le PC)
const CONFIG = {
  pads: [
    { nom: "Bruit stridant 01", fichier: 'sounds/PAD 01.m4a' },
    { nom: "Bruit stridant 02", fichier: 'sounds/PAD 02.m4a' },
    { nom: "Porte", fichier: 'sounds/PAD 03.m4a' },
    { nom: "Cri monstre 01", fichier: 'sounds/PAD 04.m4a' },
    { nom: "Cri monstre 02", fichier: 'sounds/PAD 05.m4a' },
    { nom: "Rire démoniaque", fichier: 'sounds/PAD 06.m4a' },
    { nom: "Cri d'effroi", fichier: 'sounds/PAD 07.m4a' },
    { nom: "Sonnerie téléphone", fichier: 'sounds/PAD 08.m4a' },
    { nom: "Pleurs d'enfant", fichier: 'sounds/PAD 09.m4a' }
  ]
};
// ===============================================

document.addEventListener('gesturestart', e => e.preventDefault());   // pas de zoom à deux doigts
// Relais Metered (sert seulement si la connexion directe est bloquée)
const ICE = { iceServers: [
  { urls: 'stun:stun.relay.metered.ca:80' },
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'turn:global.relay.metered.ca:80', username: 'd1ad7490c19a2d59bbed70b2', credential: 'AtSRRk4mIBYK1mzO' },
  { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: 'd1ad7490c19a2d59bbed70b2', credential: 'AtSRRk4mIBYK1mzO' },
  { urls: 'turn:global.relay.metered.ca:443', username: 'd1ad7490c19a2d59bbed70b2', credential: 'AtSRRk4mIBYK1mzO' },
  { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: 'd1ad7490c19a2d59bbed70b2', credential: 'AtSRRk4mIBYK1mzO' }
] };
const PC_ID = 'bsc-sb-7k2m9x4q';   // doit être identique sur le PC
const MAX = 2;        // nombre d'utilisations par pad
const st = document.getElementById('st');
let peer = null, conn = null, connected = false, timer = null;
const padEls = [];

function setStatus() {
  st.textContent = connected ? 'PC connecté' : 'PC non connecté';
  st.classList.toggle('off', !connected);
}

function retry() {
  clearTimeout(timer);
  timer = setTimeout(() => { if (!connected) tryConnect(); }, 3000);
}

function tryConnect() {
  if (!peer || peer.destroyed) { startPeer(); return; }
  if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} }
  if (!peer.open) { retry(); return; }
  try { if (conn) conn.close(); } catch (e) {}
  conn = peer.connect(PC_ID, { reliable: true });
  conn.on('open', () => { connected = true; setStatus(); });
  conn.on('data', msg => {
    if (msg && msg.type === 'ended' && padEls[msg.i]) padEls[msg.i].finish();
  });
  const lost = () => { connected = false; setStatus(); retry(); };
  conn.on('close', lost);
  conn.on('error', lost);
}

function startPeer() {
  peer = new Peer({ config: ICE });
  peer.on('open', tryConnect);
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
  peer.on('close', () => { connected = false; setStatus(); setTimeout(startPeer, 3000); });
  peer.on('error', () => { connected = false; setStatus(); retry(); });
}
startPeer();

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { if (!connected) tryConnect(); getLock(); }
});

// Garde l'écran allumé (sinon la connexion se coupe)
let lock = null;
async function getLock() {
  try { if ('wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('pointerdown', getLock, { once: true });

const pDiv = document.getElementById('pads');
CONFIG.pads.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'pad';
  b.innerHTML = '<div class="t2"><span class="n mono">' + String(i + 1).padStart(2, '0') + '</span>' +
                '<span class="cpt mono"></span></div>' +
                '<div><span class="nm">' + p.nom + '</span><br><small class="mono"></small></div>';
  const cpt = b.querySelector('.cpt');
  let left = MAX, safety = null;
  const maj = () => { cpt.textContent = left + '/' + MAX; };
  maj();

  b.finish = () => {
    clearTimeout(safety);
    if (!b.classList.contains('playing') && !b.classList.contains('paused')) return;
    b.classList.remove('playing', 'paused');
    if (left <= 0) b.classList.add('used');
    else if (left < MAX) b.classList.add('half');
  };
  b.resetPad = () => {
    clearTimeout(safety);
    left = MAX; maj();
    b.classList.remove('used', 'playing', 'half', 'paused');
  };

  b.onclick = () => {
    if (!connected || !conn) return;            // PC pas connecté : rien ne se passe
    if (b.classList.contains('playing')) {      // pendant le son : pause
      try { conn.send({ type: 'pause', i }); } catch (e) { return; }
      clearTimeout(safety);
      b.classList.replace('playing', 'paused');
      return;
    }
    if (b.classList.contains('paused')) {       // en pause : reprise
      try { conn.send({ type: 'resume', i }); } catch (e) { return; }
      b.classList.replace('paused', 'playing');
      clearTimeout(safety);
      safety = setTimeout(b.finish, 120000);
      return;
    }
    if (left <= 0) return;                      // plus d'utilisation
    try { conn.send({ type: 'pad', i }); } catch (e) { return; }
    left--; maj();
    b.classList.remove('half');
    b.classList.add('playing');
    clearTimeout(safety);
    safety = setTimeout(b.finish, 120000);      // sécurité si le PC ne répond pas
  };
  padEls[i] = b;
  pDiv.append(b);
});

document.getElementById('reset').onclick = () => {
  padEls.forEach(b => b.resetPad());
};
</script>
</body>
</html>
